<main id="main">

  <!-- PHOTO GALLERY -->
  <!--
    TO ADD YOUR PHOTOS:
    1. Put image files in the  images/gallery/  folder in your repo.
    2. For each photo, copy one <figure> block below and edit:
         - src        = path to your file (e.g. images/gallery/sunset.jpg)
         - alt        = short description (for accessibility)
         - figcaption = caption shown under the photo
    3. Delete any blocks you don't use.
    Photos are shown at a uniform height and arranged automatically.
  -->
  <section id="gallery" class="block wrap">
    <h2 class="section-head"><span class="tick">//</span> Photo gallery</h2>
    <p class="section-intro">
      Away from the bench — a few frames from things I've pointed a camera at.
    </p>

    <div class="gallery-grid">
      <figure class="gallery-item">
        <img src="images/gallery/photo1.jpg" alt="Garner State Park" loading="lazy">
        <figcaption>Garner State Park</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/gallery/photo2.jpg" alt="Moon above a tree" loading="lazy">
        <figcaption>Moon Above A Tree</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/gallery/photo3.jpg" alt="Moon behind a tree" loading="lazy">
        <figcaption>Moon Behind A Tree</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/gallery/photo4.jpg" alt="Raccoon" loading="lazy">
        <figcaption>Raccoon</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/gallery/photo5.jpg" alt="Puerto Rico" loading="lazy">
        <figcaption>Puerto Rico</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/gallery/photo6.jpg" alt="Bluebonnet" loading="lazy">

      </figure>
      <figure class="gallery-item">
        <img src="images/gallery/photo8.jpg" alt="Snow in Alaska" loading="lazy">
        <figcaption>Snow in Alaska</figcaption>
      </figure>
    </div>
  </section>
